<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1e261e">
  <meta name="description" content="沿汴河步行，上虹桥，穿城门。原创 Three.js 北宋汴京白昼实景。">
  <title>清明上河图 · 汴京一日</title>
  <link rel="icon" href="assets/seal.png">
  <link rel="stylesheet" href="style.css">
  <script defer src="city3d.js"></script>
</head>
<body>
  <main id="experience" aria-label="清明上河图三维漫游">
    <div id="viewport"><canvas id="world" tabindex="0" aria-label="三维汴京场景"></canvas></div>
    <div class="vignette" aria-hidden="true"></div>
    <div id="fade" aria-hidden="true"></div>
    <header class="masthead">
      <button class="brand" id="home" type="button" aria-label="汴京一日，返回开场">
        <span class="seal" aria-hidden="true">汴<br>京</span>
        <span class="brand-name">汴京一日<small>北宋 · 清明上河图</small></span>
      </button>
      <div class="top-actions">
        <button class="glass sound" id="sound" type="button" aria-pressed="true" title="环境音">
          <span class="sound-icon" aria-hidden="true"><i></i><i></i><i></i></span><span id="sound-label">环境音待播放</span>
        </button>
        <button class="glass sun-badge" id="time-button" type="button" aria-expanded="false" aria-controls="day-panel">
          <span class="sun" aria-hidden="true">☼</span><span id="period">巳时</span><i></i><time id="clock">10:24</time>
        </button>
        <button type="button" id="full" class="glass full" aria-label="全屏" title="全屏">⛶</button>
      </div>
    </header>

    <div class="day-panel glass" id="day-panel" hidden>
      <label for="time-range">白昼时辰</label>
      <input id="time-range" type="range" min="8" max="16.75" step=".0166666667" value="10.4">
      <div><span>08:00</span><span>16:45</span></div>
    </div>

    <section class="intro" id="intro" aria-labelledby="title">
      <p class="eyebrow"><span></span>北宋 · 汴京</p>
      <h1 id="title">清明上河图</h1>
      <p class="subtitle">沿汴河入城</p>
      <p class="lead">船过虹桥，脚夫在码头接货。走过桥头的市集，<br>穿进城门，听街声渐远。</p>
      <div class="intro-actions">
        <button type="button" class="primary" id="start" disabled>入城步行 <span aria-hidden="true">→</span></button>
        <button type="button" class="ghost" id="intro-tour" disabled>▷ 自动漫游</button>
      </div>
      <p id="load-status" role="status">正在准备汴京实景…</p>
    </section>

    <div id="labels" aria-label="场景地点"></div>
    <section class="walk-hud" id="walk-hud" hidden aria-label="当前位置">
      <p class="eyebrow"><span></span><span id="place-area"></span></p>
      <h2 id="place-name" aria-live="polite"></h2>
      <p id="place-note"></p>
      <p id="tour-status" hidden>自动漫游中</p>
    </section>
    <div class="aim" id="aim" hidden aria-hidden="true"></div>

    <div class="map-panel glass" id="map-panel" role="dialog" aria-modal="true" aria-labelledby="map-title" hidden>
      <div class="map-heading">
        <div><h2 id="map-title">汴京水陆图</h2><p>选择地点，沿河寻路。</p></div>
        <button type="button" class="control" id="close-map" aria-label="关闭地图">×</button>
      </div>
      <div class="map-view" id="map-view">
        <canvas id="map" aria-hidden="true"></canvas>
        <div id="map-pins"></div>
      </div>
      <ol class="map-list" id="map-list"></ol>
    </div>

    <div class="joystick" id="joystick" hidden role="group" aria-label="触屏行走控制">
      <div class="stick" id="stick" aria-hidden="true"></div>
    </div>

    <div class="controls">
      <div class="foot-actions">
        <button type="button" id="view" class="glass control" title="换个视角">⊙ <span>观景</span></button>
        <button type="button" id="map-button" class="glass control" aria-controls="map-panel" aria-expanded="false">⌖ <span>地图</span></button>
        <button type="button" id="take-control" class="glass control" hidden>⌑ <span>鼠标视角</span></button>
        <button type="button" id="tour" class="glass control" aria-pressed="false" hidden><span>▷ 自动漫游</span></button>
        <span class="look-help" id="look-help" hidden>拖动环顾 <b>·</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 行走</span>
      </div>
      <div class="wind-row">
        <span id="heading-text">北 <b>↑</b></span>
        <button type="button" id="pause" class="glass control icon" aria-label="暂停城中动态" aria-pressed="false" title="暂停城中动态">Ⅱ</button>
      </div>
    </div>
    <nav class="route-bar" aria-label="沿河路线"><ol id="route"></ol></nav>
    <noscript>开启浏览器的 JavaScript 后即可进入三维汴京。</noscript>
  </main>
</body>
</html>
